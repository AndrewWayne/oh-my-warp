name: CI

# Tier A per specs/test-plan.md §6: core macOS/Linux lanes plus a focused
# Windows integration lane. Windows deliberately excludes the vendored Warp
# GUI link; compiled-binary/no-cloud gates remain in the release workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  secret-scan:
    name: I-1 secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/workflows/scripts/grep-secrets.sh

  vendor-omw-headers:
    name: vendor omw AGPL headers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/workflows/scripts/check-vendor-omw-headers.sh

  msrv:
    name: MSRV check (1.85) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # --locked: check the SHIPPED Cargo.lock, not a fresh resolution. Without
      # it, a transitive dep can resolve to a version requiring rustc > 1.85 and
      # fail the MSRV lane even though the lockfile pins a 1.85-compatible one
      # (this happened with icu 2.2.0 — see the icu -> 2.1.x downgrade in git log).
      - run: cargo check --workspace --all-targets --locked

  clippy-and-test:
    name: ${{ matrix.os }} / clippy + test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: doc-tests
        run: cargo test --workspace --doc --locked

  ts-omw-agent:
    name: ${{ matrix.os }} / omw-agent (TS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build helper binary
        run: cargo build --release -p omw-keychain-helper
      - name: npm install
        run: npm ci --no-fund --no-audit
      - name: typecheck
        working-directory: apps/omw-agent
        run: npm run typecheck
      - name: test
        working-directory: apps/omw-agent
        env:
          OMW_KEYCHAIN_HELPER: ${{ github.workspace }}/target/release/omw-keychain-helper
        run: npm test

  ts-web-controller:
    name: web-controller (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install
        run: npm ci --no-fund --no-audit
      - name: build (tsc + vite)
        working-directory: apps/web-controller
        run: npm run build
      - name: test
        working-directory: apps/web-controller
        run: npm test

  ts-byorc-client:
    name: byorc-client (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install
        run: npm ci --no-fund --no-audit
      # Typecheck the shared BYORC client on its own tsconfig. This proves it
      # stays decoupled from the Web Controller (no React/xterm/IndexedDB/DOM
      # app imports), so Node clients such as omw-mcp can consume it.
      - name: typecheck
        working-directory: packages/byorc-client
        run: npm run typecheck

  windows-integration:
    name: Windows / root + TS integration
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare retained logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/windows-ci | Out-Null
      - name: Install selected Node workspaces
        shell: pwsh
        run: |
          & npm.cmd ci --no-fund --no-audit `
            --workspace @oh-my-warp/omw-agent `
            --workspace @oh-my-warp/web-controller `
            --workspace @oh-my-warp/byorc-client `
            --include-workspace-root=false 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/npm-ci.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Build Web Controller
        shell: pwsh
        run: |
          & npm.cmd run build --workspace @oh-my-warp/web-controller 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/web-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Test Web Controller
        shell: pwsh
        run: |
          & npm.cmd test --workspace @oh-my-warp/web-controller 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/web-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Typecheck BYORC client
        shell: pwsh
        run: |
          & npm.cmd run typecheck --workspace @oh-my-warp/byorc-client 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/byorc-typecheck.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Clippy root Windows workspace
        shell: pwsh
        env:
          OMW_SKIP_WEB_BUILD: '1'
        run: |
          & cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/cargo-clippy.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Test root Windows workspace
        shell: pwsh
        env:
          OMW_SKIP_WEB_BUILD: '1'
        run: |
          & cargo test --workspace --all-targets --locked 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/cargo-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Test root Windows doctests
        shell: pwsh
        env:
          OMW_SKIP_WEB_BUILD: '1'
        run: |
          & cargo test --workspace --doc --locked 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/cargo-doc-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Build Windows keychain helper
        shell: pwsh
        env:
          OMW_SKIP_WEB_BUILD: '1'
        run: |
          & cargo build --locked -p omw-keychain-helper 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/keychain-helper-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Typecheck omw-agent
        shell: pwsh
        run: |
          & npm.cmd run typecheck --workspace @oh-my-warp/omw-agent 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/agent-typecheck.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Test omw-agent with Windows helper
        shell: pwsh
        env:
          OMW_KEYCHAIN_HELPER: ${{ github.workspace }}\target\debug\omw-keychain-helper.exe
        run: |
          & npm.cmd test --workspace @oh-my-warp/omw-agent 2>&1 |
            Tee-Object -FilePath artifacts/windows-ci/agent-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Upload Windows CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-logs
          path: artifacts/windows-ci
          if-no-files-found: warn
          retention-days: 14
